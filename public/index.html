<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>ClearSkies</title>
  <meta name="description" content="Hyperlocal minute-by-minute rain forecasting.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%230ea5e9'/><path d='M30 58a14 14 0 0 1 3-27 19 19 0 0 1 35 5 12 12 0 0 1-3 23z' fill='white'/><path d='M38 74l4-9M52 78l5-11M64 72l4-9' stroke='white' stroke-width='6' stroke-linecap='round'/></svg>">

  <!-- Tailwind, PRECOMPILED for this app. The config lives in
       tailwind.config.js at the repo root; the Dockerfile's builder stage
       compiles it to public/tailwind.css on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code.
       Writing class names as whole literals is what keeps this working: a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler, so public/app.js keeps every class it
       applies in a full literal. -->
  <link rel="stylesheet" href="/tailwind.css">

  <!-- Platform infrastructure, centrally hosted. Never vendor these: the
       bridge is how the app answers the shell, and the native kit ships
       fleet-wide fixes on the next page load. The platform serves them on
       this app's own origin, so the paths are relative: no hostname here
       for a platform domain move to break. -->
  <link rel="stylesheet" href="/usernode-native/v1/native.css">
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <script src="/usernode-native/v1/native.js"></script>

  <style>
    /* Theme the native kit to ClearSkies' sky blue rather than the platform
       violet. The kit routes every colour through these custom properties,
       so this is the supported way to rebrand it. */
    :root, .dark {
      --un-accent: #38bdf8;
      --un-accent-contrast: #06131f;
      --un-group-bg: rgba(24, 32, 45, 0.72);
      --un-sheet-bg: #131a25;
      --un-popover-bg: #1a222f;
      --un-navbar-bg: rgba(9, 13, 20, 0.72);
      --un-hairline: rgba(148, 163, 184, 0.16);
      --un-muted: #94a3b8;
      --un-backdrop: rgba(2, 6, 12, 0.6);
    }

    /* A night-sky gradient behind the whole app. Fixed so it does not
       scroll away on a long forecast. */
    body {
      background-color: #05080e;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1100px 620px at 12% -8%, rgba(56, 189, 248, 0.20), transparent 62%),
        radial-gradient(900px 540px at 88% 4%, rgba(129, 140, 248, 0.16), transparent 60%),
        linear-gradient(180deg, #0b1220 0%, #070b13 55%, #05080e 100%);
      z-index: -1;
    }

    /* Horizontal strips (the day timeline) scroll inside themselves so the
       page body never scrolls sideways. */
    .scroll-x {
      overflow-x: auto;
      overscroll-behavior-x: contain;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .scroll-x::-webkit-scrollbar { display: none; }

    /* The nowcast curve draws itself once on load, which is the one place an
       entrance animation earns its keep: it is the reading of the chart. */
    .curve-draw {
      stroke-dasharray: 1400;
      stroke-dashoffset: 1400;
      animation: draw 900ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .curve-draw { animation: none; stroke-dashoffset: 0; }
    }

    /* Anything fixed to an edge respects the insets the platform forwards,
       falling back to env() so the app is also correct opened standalone. */
    .safe-bottom { padding-bottom: calc(1rem + var(--un-safe-inset-bottom, env(safe-area-inset-bottom, 0px))); }
    .safe-top { padding-top: calc(0.5rem + var(--un-safe-inset-top, env(safe-area-inset-top, 0px))); }
  </style>
</head>
<body class="text-slate-100 min-h-screen antialiased">
  <div id="app"></div>
  <script src="/app.js"></script>
</body>
</html>
